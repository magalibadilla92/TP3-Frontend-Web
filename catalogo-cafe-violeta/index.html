<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Café Violeta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1>☕ Café Violeta</h1>
    <p>Un momento para vos</p>
  </header>

  <main class="container py-4">
    <section class="filtros">
      <input id="buscador" class="form-control" type="search"
             placeholder="Buscar productos...">

      <select id="filtroCategoria" class="form-select">
        <option value="">Todas las categorías</option>
        <option value="Café">Café</option>
        <option value="Panadería">Panadería</option>
        <option value="Pastelería">Pastelería</option>
        <option value="Infusiones">Infusiones</option>
      </select>

      <input id="precioMaximo" class="form-control" type="number"
             min="0" placeholder="Precio máximo">
    </section>

    <div class="row g-4 mt-2">
      <section class="col-lg-8">
        <h2 class="subtitulo">Nuestros productos</h2>
        <div id="catalogo" class="productos"></div>
        <p id="mensajeVacio" class="text-center mt-3" hidden>
          No se encontraron productos.
        </p>
      </section>

      <aside class="col-lg-4">
        <div class="carrito">
          <h2 class="subtitulo">🛒 Mi carrito</h2>
          <div id="contenidoCarrito"></div>
          <hr>
          <p class="total">Total: <span id="total">$0</span></p>
          <button id="vaciarCarrito" class="btn btn-outline-secondary w-100">
            Vaciar carrito
          </button>
        </div>
      </aside>
    </div>
  </main>

  <div id="modalProducto" class="modal-personalizado" hidden>
    <div class="modal-contenido">
      <button id="cerrarModal" class="cerrar" aria-label="Cerrar">×</button>
      <div id="detalleProducto"></div>
    </div>
  </div>

  <footer>
    <p>Café Violeta · Catálogo de práctica</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
